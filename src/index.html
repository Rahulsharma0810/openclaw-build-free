<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: white;
            font-size: 28px;
            font-weight: 600;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .connection-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        .connection-card h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .connection-card p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        #iframe-container {
            display: none;
            width: 100%;
            height: calc(100vh - 80px);
            border: none;
        }

        #iframe-container.show {
            display: block;
        }

        #iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .disconnect-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            display: none;
        }

        .disconnect-btn.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>OpenClaw Client</h1>
        <button class="disconnect-btn" id="disconnectBtn">Disconnect</button>
    </div>

    <div class="container" id="connectionContainer">
        <div class="connection-card">
            <h2>Connect to OpenClaw</h2>
            <p>Enter your OpenClaw server URL to establish a connection.</p>
            
            <form id="connectionForm">
                <div class="form-group">
                    <label for="serverUrl">Server URL</label>
                    <input 
                        type="url" 
                        id="serverUrl" 
                        placeholder="https://rahuls-mac-mini.husky-tet.ts.net:18789"
                        value="https://rahuls-mac-mini.husky-tet.ts.net:18789"
                        required
                    >
                </div>

                <button type="submit" class="btn" id="connectBtn">Connect</button>

                <div class="status" id="status"></div>
            </form>
        </div>
    </div>

    <div id="iframe-container">
        <iframe id="openclawFrame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
    </div>

    <script type="module">
        const form = document.getElementById('connectionForm');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const serverUrlInput = document.getElementById('serverUrl');
        const status = document.getElementById('status');
        const connectionContainer = document.getElementById('connectionContainer');
        const iframeContainer = document.getElementById('iframe-container');
        const openclawFrame = document.getElementById('openclawFrame');

        // Load saved server URL
        const savedUrl = localStorage.getItem('openclaw_server_url');
        if (savedUrl) {
            serverUrlInput.value = savedUrl;
        }

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = serverUrlInput.value.trim();
            
            if (!url) {
                showStatus('Please enter a server URL', 'error');
                return;
            }

            connectBtn.disabled = true;
            showStatus('Connecting...', 'info');

            try {
                // Validate URL
                new URL(url);
                
                // Save URL
                localStorage.setItem('openclaw_server_url', url);
                
                // Load in iframe
                openclawFrame.src = url;
                
                // Wait a bit then show iframe
                setTimeout(() => {
                    connectionContainer.style.display = 'none';
                    iframeContainer.classList.add('show');
                    disconnectBtn.classList.add('show');
                }, 1000);
                
                showStatus('Connected successfully!', 'success');
            } catch (error) {
                showStatus(`Connection failed: ${error.message}`, 'error');
                connectBtn.disabled = false;
            }
        });

        disconnectBtn.addEventListener('click', () => {
            openclawFrame.src = 'about:blank';
            iframeContainer.classList.remove('show');
            disconnectBtn.classList.remove('show');
            connectionContainer.style.display = 'flex';
            connectBtn.disabled = false;
            showStatus('', '');
        });

        // Handle iframe load errors
        openclawFrame.addEventListener('error', (e) => {
            showStatus('Failed to load OpenClaw interface', 'error');
            connectBtn.disabled = false;
        });
    </script>
</body>
</html>
